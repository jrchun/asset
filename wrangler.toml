# Cloudflare Worker 설정(이 파일이 기준이다). name은 대시보드의 Worker 이름과 같아야 한다.
# name, database_name, database_id는 scripts/cf_mcp.mjs fill(또는 wrangler d1 create 출력)로 채운다.
# 편집 암호(WRITE_TOKEN)는 비밀값이라 여기 두지 않는다: 대시보드 > Worker > 설정 > 변수 및 비밀 > Secret.
name = "my-app"
main = "./src/worker.js"
compatibility_date = "2026-11-01"
send_metrics = false

# 정적 파일. 요청과 맞는 파일이 있으면 Worker를 거치지 않고 바로 보낸다. 없을 때만 src/worker.js가 실행된다.
[assets]
directory = "./web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "my-app"
database_id = "__D1_DATABASE_ID__"

# 예약 작업(src/jobs.js). UTC 기준: 매일 07:30 KST. 무료 플랜은 계정 전체에서 Cron Trigger 5개까지다.
[triggers]
crons = ["30 22 * * *"]
