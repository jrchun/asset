# Cloudflare Worker 설정(이 파일이 기준이다). name은 대시보드의 Worker 이름과 같아야 한다.
# name, database_name, database_id는 scripts/cf_mcp.mjs fill(또는 wrangler d1 create 출력)로 채운다.
# 편집 암호(WRITE_TOKEN)는 비밀값이라 여기 두지 않는다: 대시보드 > Worker > 설정 > 변수 및 비밀 > Secret.
name = "rebalance"
main = "./src/worker.js"
compatibility_date = "2026-11-01"
# 옛 workers.dev 주소(rebalance.tedcheon.workers.dev)는 닫았다(사용자 결정 2026-11-25). 새 주소만 쓴다.
# 다시 열려면 true로 바꾼다(routes가 있으면 이 줄이 없을 때 Cloudflare가 workers.dev를 끈다).
workers_dev = false
send_metrics = false

# 정적 파일. 요청과 맞는 파일이 있으면 Worker를 거치지 않고 바로 보낸다. 없을 때만 src/worker.js가 실행된다.
[assets]
directory = "./web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rebalance"
database_id = "c8d41855-6216-4b9b-8e02-98e703c69d85"

# 예약 작업(src/jobs.js). UTC 기준: 매일 07:30 KST. 무료 플랜은 계정 전체에서 Cron Trigger 5개까지다.
[triggers]
crons = ["30 22 * * *"]

# >>> 내 도메인 주소 (scripts/cf_mcp.mjs fill이 관리한다. 손으로 고치지 않는다)
[[routes]]
pattern = "rebalance.woongstudio.com"
custom_domain = true
# <<< 내 도메인 주소
