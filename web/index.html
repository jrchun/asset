<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>내 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>내 앱</h1>
    <p class="sub">새 프로젝트 시작 틀의 예제 화면입니다. 고치면 0.7초 뒤 자동으로 저장됩니다.</p>
  </header>

  <section class="panel">
    <div class="panel-head"><h2>메모</h2><span class="hint num" id="count">0자</span></div>
    <div class="field"><label for="title">제목</label><input id="title" autocomplete="off"></div>
    <div class="field"><label for="memo">내용</label><textarea id="memo" rows="8"></textarea></div>
  </section>

  <footer class="foot">
    <span class="hint" id="saveState" role="status" aria-live="polite">불러오는 중</span>
    <form class="token" id="tokenForm" hidden>
      <label for="tokenIn">편집 암호</label>
      <input id="tokenIn" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">확인</button>
    </form>
  </footer>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
